name: Build

on:
  push:
  pull_request:

jobs:
  build-linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config dpkg-dev wget \
            libglfw3-dev libgl1-mesa-dev \
            libiio-dev libhackrf-dev libfftw3-dev

      - name: Determine package version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DIQFORGE_BUILD_TESTS=ON -DIQFORGE_PACKAGE_VERSION=${{ steps.version.outputs.value }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Create Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB

      - name: Install AppImageTool
        run: |
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage
        run: |
          mkdir -p dist-appimage
          mkdir -p appimage-root/usr/bin
          cp build/common/iqforge appimage-root/usr/bin/iqforge
          mkdir -p appimage-root/usr/share/applications
          mkdir -p appimage-root/usr/share/doc/iqforge
          cp assets/iqforge.desktop appimage-root/usr/share/applications/iqforge.desktop
          cp assets/iqforge.desktop appimage-root/iqforge.desktop
          mkdir -p appimage-root/usr/share/icons/hicolor/256x256/apps
          cp assets/iqforge.png appimage-root/usr/share/icons/hicolor/256x256/apps/iqforge.png
          cp assets/iqforge.png appimage-root/iqforge.png
          ln -s usr/bin/iqforge appimage-root/AppRun
          cp README.md appimage-root/usr/share/doc/iqforge/README
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run appimage-root dist-appimage/iqforge.AppImage

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: iqforge-linux-${{ matrix.os }}-binary
          path: build/common/iqforge

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: iqforge-deb-${{ matrix.os }}
          path: ./*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: iqforge-appimage-${{ matrix.os }}
          path: dist-appimage/*.AppImage

  # Отдельный self-hosted job (Debian 13.6, physical machine).
  # ВАЖНО: намеренно НЕ запускается на pull_request — self-hosted раннер не
  # эфемерный, и прогон произвольного PR-кода на нём (в т.ч. из форков)
  # даёт исполнение кода на твоей реальной машине. Билдится только на push.
  build-linux-selfhosted:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config dpkg-dev wget \
            libglfw3-dev libgl1-mesa-dev \
            libiio-dev libhackrf-dev libfftw3-dev

      - name: Determine package version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DIQFORGE_BUILD_TESTS=ON -DIQFORGE_PACKAGE_VERSION=${{ steps.version.outputs.value }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Create Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB

      - name: Install AppImageTool
        run: |
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage
        run: |
          mkdir -p dist-appimage
          mkdir -p appimage-root/usr/bin
          cp build/common/iqforge appimage-root/usr/bin/iqforge
          mkdir -p appimage-root/usr/share/applications
          mkdir -p appimage-root/usr/share/doc/iqforge
          cp assets/iqforge.desktop appimage-root/usr/share/applications/iqforge.desktop
          cp assets/iqforge.desktop appimage-root/iqforge.desktop
          mkdir -p appimage-root/usr/share/icons/hicolor/256x256/apps
          cp assets/iqforge.png appimage-root/usr/share/icons/hicolor/256x256/apps/iqforge.png
          cp assets/iqforge.png appimage-root/iqforge.png
          ln -s usr/bin/iqforge appimage-root/AppRun
          cp README.md appimage-root/usr/share/doc/iqforge/README
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run appimage-root dist-appimage/iqforge.AppImage

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: iqforge-linux-debian-13.6-binary
          path: build/common/iqforge

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: iqforge-deb-debian-13.6
          path: ./*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: iqforge-appimage-debian-13.6
          path: dist-appimage/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install ninja
          choco install pkgconfiglite
          choco install nsis

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install vcpkg
        uses: johnwason/vcpkg-action@v6
        id: vcpkg
        with:
          pkgs: glfw3 gl3w fftw3 libusb pthreads
          triplet: x64-windows
          token: ${{ github.token }}

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}\vcpkg\installed\x64-windows\lib\pkgconfig
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DIQFORGE_BUILD_TESTS=ON -DIQFORGE_PACKAGE_VERSION=${{ steps.version.outputs.value }} ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Collect runtime DLLs
        run: |
          Copy-Item "${{ github.workspace }}\vcpkg\installed\x64-windows\bin\*.dll" -Destination build\common
          Copy-Item "build\_deps\libiio-prebuilt\Windows-VS-2022-x64\libiio.dll" -Destination build\common
          Copy-Item "build\_deps\libiio-prebuilt\Windows-VS-2022-x64\libxml2.dll" -Destination build\common
          Copy-Item "build\_deps\libiio-prebuilt\Windows-VS-2022-x64\libserialport-0.dll" -Destination build\common
          Copy-Item "build\_deps\hackrf-build\src\hackrf.dll" -Destination build\common

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: iqforge-windows-x86_64
          path: |
            build/common/iqforge.exe
            build/common/*.dll

      - name: Create Windows installer
        run: cpack --config build/CPackConfig.cmake -G NSIS

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: iqforge-windows-installer
          path: iqforge-*-win64.exe

  release:
    needs: [build-linux, build-linux-selfhosted, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ---- Linux artifacts for each OS version ----
      - name: Download binary (22.04)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-linux-ubuntu-22.04-binary
          path: linux-22.04

      - name: Download Debian (22.04)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-deb-ubuntu-22.04
          path: linux-22.04-deb

      - name: Download AppImage (22.04)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-appimage-ubuntu-22.04
          path: linux-22.04-appimage

      - name: Download binary (24.04)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-linux-ubuntu-24.04-binary
          path: linux-24.04

      - name: Download Debian (24.04)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-deb-ubuntu-24.04
          path: linux-24.04-deb

      - name: Download AppImage (24.04)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-appimage-ubuntu-24.04
          path: linux-24.04-appimage

      - name: Download binary (latest, represents 26.04+)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-linux-ubuntu-latest-binary
          path: linux-latest

      - name: Download Debian (latest)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-deb-ubuntu-latest
          path: linux-latest-deb

      - name: Download AppImage (latest)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-appimage-ubuntu-latest
          path: linux-latest-appimage

      # ---- Debian 13.6 (self-hosted) artifacts ----
      - name: Download binary (Debian 13.6)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-linux-debian-13.6-binary
          path: linux-debian-13.6

      - name: Download Debian package (Debian 13.6)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-deb-debian-13.6
          path: linux-debian-13.6-deb

      - name: Download AppImage (Debian 13.6)
        uses: actions/download-artifact@v4
        with:
          name: iqforge-appimage-debian-13.6
          path: linux-debian-13.6-appimage

      # ---- Windows artifacts ----
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: iqforge-windows-x86_64
          path: windows

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: iqforge-windows-installer
          path: windows-installer

      - name: Prepare release files
        run: |
          mkdir -p dist

          # Linux binaries
          cp linux-22.04/iqforge dist/iqforge-linux-22.04
          cp linux-24.04/iqforge dist/iqforge-linux-24.04
          cp linux-latest/iqforge dist/iqforge-linux-latest
          cp linux-debian-13.6/iqforge dist/iqforge-linux-debian-13.6

          # Debian packages: rename to include OS version
          cd linux-22.04-deb
          for f in *.deb; do
            mv "$f" "${f%.deb}-ubuntu22.04.deb"
          done
          cp *.deb ../dist/
          cd ..

          cd linux-24.04-deb
          for f in *.deb; do
            mv "$f" "${f%.deb}-ubuntu24.04.deb"
          done
          cp *.deb ../dist/
          cd ..

          cd linux-latest-deb
          for f in *.deb; do
            mv "$f" "${f%.deb}-ubuntu-latest.deb"
          done
          cp *.deb ../dist/
          cd ..

          cd linux-debian-13.6-deb
          for f in *.deb; do
            mv "$f" "${f%.deb}-debian13.6.deb"
          done
          cp *.deb ../dist/
          cd ..

          # AppImages: rename similarly
          cd linux-22.04-appimage
          for f in *.AppImage; do
            mv "$f" "${f%.AppImage}-ubuntu22.04.AppImage"
          done
          cp *.AppImage ../dist/
          cd ..

          cd linux-24.04-appimage
          for f in *.AppImage; do
            mv "$f" "${f%.AppImage}-ubuntu24.04.AppImage"
          done
          cp *.AppImage ../dist/
          cd ..

          cd linux-latest-appimage
          for f in *.AppImage; do
            mv "$f" "${f%.AppImage}-ubuntu-latest.AppImage"
          done
          cp *.AppImage ../dist/
          cd ..

          cd linux-debian-13.6-appimage
          for f in *.AppImage; do
            mv "$f" "${f%.AppImage}-debian13.6.AppImage"
          done
          cp *.AppImage ../dist/
          cd ..

          # Windows: zip the executable with DLLs
          cd windows
          zip -r ../dist/iqforge-windows-x86_64.zip .
          cd ..

          # Windows installer
          cp windows-installer/*.exe dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iqforge-linux-22.04
            dist/iqforge-linux-24.04
            dist/iqforge-linux-latest
            dist/iqforge-linux-debian-13.6
            dist/*.deb
            dist/*.AppImage
            dist/iqforge-windows-x86_64.zip
            dist/*-win64.exe